<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>东方塔防 · 博丽神社防卫战</title>
<style>
  :root { --red: #c8283c; --ink: #2a1a22; --paper: #fff8ee; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #140d14; color: var(--paper);
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: "Hiragino Mincho ProN", "Songti SC", "Noto Serif SC", serif; overflow: hidden; }
  #wrap { position: absolute; left: 50%; top: 50%; width: 1536px; height: 864px; transform-origin: 0 0; }
  canvas { display: block; width: 1536px; height: 864px; border-radius: 6px; }
  .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 22px; align-items: center;
    padding: 10px 18px; background: linear-gradient(#140d14e0, #140d1400); font-size: 26px; pointer-events: none; }
  .hud b { color: #ffd76a; font-size: 30px; }
  .hud .spacer { flex: 1; }
  .hud button, .hud .gh { pointer-events: auto; }
  .gh { color: #fff8ee; opacity: .75; display: flex; align-items: center; }
  .gh:hover { opacity: 1; color: #ffd76a; }
  .overlay .src { font-size: 18px; color: #d9a441; }
  button { font: inherit; color: var(--paper); background: #3a1f2cdd; border: 2px solid #d9a441; border-radius: 10px;
    padding: 6px 16px; cursor: pointer; font-size: 22px; }
  button:hover:not(:disabled) { background: #5a2a3c; }
  button:disabled { opacity: .45; cursor: default; }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 14px; align-items: flex-end;
    padding: 12px 18px; background: linear-gradient(#140d1400, #140d14e8); pointer-events: none; }
  .card { pointer-events: auto; width: 128px; text-align: center; background: #2a1822cc; border: 2px solid #6b4a3a;
    border-radius: 12px; padding: 4px 4px 6px; cursor: pointer; font-size: 18px; position: relative; }
  .card img { width: 84px; height: 84px; object-fit: contain; display: block; margin: 0 auto; }
  .card.active { border-color: #ffd76a; box-shadow: 0 0 18px #ffd76a88; }
  .card.poor { filter: grayscale(.8) brightness(.7); }
  .card .key { position: absolute; left: 6px; top: 2px; font-size: 14px; color: #d9a441; }
  .spell { pointer-events: auto; width: 96px; height: 96px; border-radius: 50%; overflow: hidden; position: relative;
    border: 3px solid #d9a441; cursor: pointer; background: #2a1822; }
  .spell img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }
  .spell .cd { position: absolute; inset: 0; background: conic-gradient(#000b var(--p), transparent 0); }
  .spell .key { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 14px; text-shadow: 0 0 4px #000; }
  .spell.ready { box-shadow: 0 0 22px #ff7ab8; animation: pulse 1.2s infinite; }
  .spell.off { filter: grayscale(1) brightness(.5); cursor: default; }
  @keyframes pulse { 50% { box-shadow: 0 0 34px #ffd76a; } }
  .dock .spacer { flex: 1; }
  #popup { position: absolute; display: none; background: #2a1822ee; border: 2px solid #d9a441; border-radius: 12px;
    padding: 10px; font-size: 18px; min-width: 190px; }
  #popup .row { display: flex; gap: 8px; margin-top: 8px; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(#140d14aa, #140d14f2); gap: 18px; text-align: center; }
  .overlay h1 { font-size: 76px; margin: 0; letter-spacing: 8px; color: #fff; text-shadow: 0 0 24px var(--red); }
  .overlay p { font-size: 22px; margin: 0; opacity: .85; line-height: 1.7; }
  .overlay button { font-size: 30px; padding: 10px 40px; }
  .overlay .cast { display: flex; gap: 10px; }
  .overlay .cast img { height: 260px; }
  #pauseOverlay { position: absolute; left: 50%; top: 110px; transform: translateX(-50%); pointer-events: none;
    background: #140d14cc; border: 2px solid #d9a441; border-radius: 12px; padding: 10px 22px; font-size: 22px; }
  #pauseOverlay b { color: #ffd76a; font-size: 28px; }
  .hidden { display: none !important; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 9; background: #140d14; color: #fff8ee; font-size: 22px;
    align-items: center; justify-content: center; text-align: center; padding: 24px; }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="rotate">请把手机横过来玩 ↻</div>
<div id="wrap">
  <canvas id="c" width="1536" height="864"></canvas>
  <div class="hud">
    <span>赛钱 <b id="gold">0</b></span>
    <span>残机 <b id="lives">0</b></span>
    <span>第 <b id="wave">1</b> / 10 波</span>
    <span class="spacer"></span>
    <button id="speed">×1</button>
    <button id="mute">♪</button>
    <button id="pause">⏸</button>
    <button id="next">开始下一波 ␣</button>
    <a class="gh" href="https://github.com/grapeot/touhou-td" target="_blank" rel="noopener" title="源代码（GitHub）"><svg viewBox="0 0 16 16" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
  </div>
  <div class="dock">
    <div class="card" data-type="reimu"><span class="key">1</span><img src="assets/reimu_chibi.png"><div>灵梦 <span class="cost"></span></div></div>
    <div class="card" data-type="marisa"><span class="key">2</span><img src="assets/marisa_chibi.png"><div>魔理沙 <span class="cost"></span></div></div>
    <div class="card" data-type="sakuya"><span class="key">3</span><img src="assets/sakuya_chibi.png"><div>咲夜 <span class="cost"></span></div></div>
    <span class="spacer"></span>
    <div class="spell" data-type="reimu"><img src="assets/reimu_portrait.png"><div class="cd"></div><div class="key">Q</div></div>
    <div class="spell" data-type="marisa"><img src="assets/marisa_portrait.png"><div class="cd"></div><div class="key">W</div></div>
    <div class="spell" data-type="sakuya"><img src="assets/sakuya_portrait.png"><div class="cd"></div><div class="key">E</div></div>
  </div>
  <div id="popup">
    <div id="pname"></div>
    <div class="row"><button id="up">升级</button><button id="sell">出售</button></div>
  </div>
  <div class="overlay" id="title">
    <div class="cast"><img src="assets/marisa_portrait.png"><img src="assets/reimu_portrait.png"><img src="assets/sakuya_portrait.png"></div>
    <h1>博丽神社防卫战</h1>
    <p>妖精们冲着赛钱箱来了。在石台上安排灵梦、魔理沙和咲夜守住参道。<br>
       波次中点右下角头像发动符卡。坚持十波，最后会有一只自称最强的冰之妖精。</p>
    <button id="start">开始</button>
    <a class="src" href="https://github.com/grapeot/touhou-td" target="_blank" rel="noopener">源代码 · GitHub</a>
  </div>
  <div class="hidden" id="pauseOverlay"><b>暂停中</b>　可以照常摆塔、升级　点 ▶ 或按 P 继续</div>
  <div class="overlay hidden" id="end">
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <button id="restart">再来一次</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
